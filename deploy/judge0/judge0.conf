################################################################################
# Judge0 CE - self-hosted production configuration
# This file configures the judge0/judge0:1.13.1 server AND workers (it is
# mounted read-only into both containers, exactly as the official compose does).
#
# Values below HARDEN the default config for production and are aligned with
# the limits the CareerPilot backend already enforces via
# backend/config.py (judge0_* settings) and backend/sandbox/executor.py.
#
# To generate the two REQUIRED secrets (REDIS_PASSWORD, POSTGRES_PASSWORD):
#   openssl rand -hex 32   (run twice, use two different values)
# To generate AUTHN_TOKEN (the bearer token the backend sends):
#   openssl rand -hex 32
################################################################################

################################################################################
# Judge0 Server Configuration
################################################################################
# No telemetry in production.
JUDGE0_TELEMETRY_ENABLE=false

# Allow synchronous wait-for-result (the backend polls the submission status).
ENABLE_WAIT_RESULT=true

# The backend sends plain source + stdin, no base64, no batch, no callbacks.
DISABLE_IMPLICIT_BASE64_ENCODING=true
ENABLE_BATCHED_SUBMISSIONS=false
ENABLE_CALLBACKS=false
ENABLE_SUBMISSION_DELETE=false

# Do NOT serve docs as the homepage; keep the API surface small.
USE_DOCS_AS_HOMEPAGE=false

################################################################################
# Judge0 Workers Configuration
################################################################################
INTERVAL=0.25
# 1 worker per vCPU is a good default for a small VM. Override with COUNT.
COUNT=2
MAX_QUEUE_SIZE=256

################################################################################
# Judge0 Server Access Configuration
################################################################################
# Lock the API to the app's own calls. If you run the backend on the same VM
# behind a reverse proxy this can stay blank (all origins allowed internally),
# but for a public endpoint recommend restricting ALLOW_IP to the VM's LAN
# CIDR or the backend's egress IP. Leave blank to allow all.
ALLOW_ORIGIN=
DISALLOW_ORIGIN=
ALLOW_IP=
DISALLOW_IP=

################################################################################
# Judge0 Authentication Configuration
################################################################################
# REQUIRED in production. The backend sends this header+token on every call
# (see JUDGE0_AUTH_HEADERS in backend .env).
AUTHN_HEADER=X-Judge0-Token
AUTHN_TOKEN=CHANGE_ME_openssl_rand_hex_32

################################################################################
# Judge0 Authorization Configuration
################################################################################
# Protected (admin) calls are not used by the app; leave authorization disabled.
AUTHZ_HEADER=X-Auth-User
AUTHZ_TOKEN=

################################################################################
# Redis Configuration
################################################################################
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=CHANGE_ME_REDIS_openssl_rand_hex_32

################################################################################
# PostgreSQL Configuration
################################################################################
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=CHANGE_ME_PG_openssl_rand_hex_32

################################################################################
# Submission Configuration
################################################################################
# Aligned with backend/config.py judge0 defaults:
#   cpu_time_limit=5, cpu_extra_time=1, wall_time_limit=10,
#   memory_limit_kb=128000, stack_limit_kb=65536, max_processes=32
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
CPU_EXTRA_TIME=1
MAX_CPU_EXTRA_TIME=5
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=512000
STACK_LIMIT=65536
MAX_STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=32
MAX_MAX_PROCESSES_AND_OR_THREADS=120

# Deny the submitted program any network access by default (safe for coding
# challenges which are pure stdin/stdout problems).
ALLOW_ENABLE_NETWORK=false
ENABLE_NETWORK=false

# Keep per-process/thread limits at their default safe values.
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true

MAX_FILE_SIZE=1024
MAX_MAX_FILE_SIZE=4096
REDIRECT_STDERR_TO_STDOUT=false


################################################################################
# Rails Configuration
################################################################################
RAILS_ENV=production
SECRET_KEY_BASE=CHANGE_ME_RAILS_openssl_rand_hex_64

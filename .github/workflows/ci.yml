name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check backend/

      - name: Test
        env:
          DATABASE_URL: sqlite+aiosqlite:///./career_platform_test.db
        run: pytest backend/tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Generate Prisma client
        working-directory: frontend
        env:
          INTERVIEW_DATABASE_URL: file:./build.db
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Test
        working-directory: frontend
        env:
          INTERVIEW_DATABASE_URL: file:./build.db
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          INTERVIEW_DATABASE_URL: file:./build.db
        run: npm run build
